<!doctype html>
<html lang="ko" data-theme="__THEME__" data-accent="__ACCENT__" data-default-theme="__THEME__" data-default-accent="__ACCENT__" data-version="__VERSION__">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141517">
    <title>__BRAND_TITLE__</title>
    <link rel="icon" href="__BRAND_FAVICON__">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        // 테마를 그리기 전에 정해 둔다 (깜빡임 방지). 사용자가 고른 값이 있으면 관리자 기본값 대신
        (function () {
            var r = document.documentElement;
            try {
                var t = JSON.parse(localStorage.getItem('yp_theme') || 'null');
                if (t && t.theme) r.dataset.theme = t.theme;
                if (t && t.accent) r.dataset.accent = t.accent;
            } catch (e) { /* 저장소를 못 쓰는 브라우저 */ }
        })();
    </script>
    <!-- 재생 엔진 (원래 플러그인과 같은 버전) - 일반 script라 모듈보다 먼저 window.Hls / window.mpegts가 잡힌다 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
</head>
<body>
    <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" title="메뉴"><i class="fa-solid fa-bars"></i></button>
        <a class="brand" href="#/home">__BRAND_MARK__<span class="brand-name">__BRAND_TITLE__</span></a>
        <form id="searchForm" class="search" role="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" type="search" placeholder="영화, 드라마, 채널 검색  ( / )" autocomplete="off">
        </form>
    </header>
    <nav id="nav" class="sidebar"></nav>
    <div id="navScrim" class="nav-scrim"></div>
    <main id="main" class="main"></main>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
