<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141517">
    <title>Yume Player</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e5a00d'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23141517'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <!-- 재생 엔진 (원래 플러그인과 같은 버전) - 일반 script라 모듈보다 먼저 window.Hls / window.mpegts가 잡힌다 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
</head>
<body>
    <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" title="메뉴"><i class="fa-solid fa-bars"></i></button>
        <a class="brand" href="#/home"><span class="brand-mark"><i class="fa-solid fa-play"></i></span><span class="brand-name">Yume Player</span></a>
        <form id="searchForm" class="search" role="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" type="search" placeholder="영화, 드라마, 채널 검색  ( / )" autocomplete="off">
        </form>
        <a class="icon-btn" href="#/settings" title="설정"><i class="fa-solid fa-gear"></i></a>
    </header>
    <nav id="nav" class="sidebar"></nav>
    <div id="navScrim" class="nav-scrim"></div>
    <main id="main" class="main"></main>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
