name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes ym_player tests
      - name: Tests
        run: python -m pytest -q tests

  # 화면(브라우저) 테스트: 실제 서버 + 헤드리스 Chromium으로 로그인·설정·라디오·팟캐스트·Plex→텔레그램 고르기 창 (tests/e2e)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Screen tests (Playwright)
        env:
          YMP_E2E: "1"
        run: python -m pytest -v tests/e2e
